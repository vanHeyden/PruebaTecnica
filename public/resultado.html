<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resultado del pago | Kushki UAT</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1 id="hero-title">Procesando resultado</h1>
      <p id="hero-subtitle">Consulta el detalle de la transacción</p>
    </header>

    <main class="wrap">
      <section class="card">
        <span class="badge" id="env-badge">UAT</span>
        <h2 class="result-title" id="status-title">Resultado</h2>
        <p class="hint" id="status-message"></p>
        <div class="cards">
          <table>
            <tbody>
              <tr>
                <th>Estado</th>
                <td id="field-status"></td>
              </tr>
              <tr>
                <th>Código</th>
                <td id="field-code"></td>
              </tr>
              <tr>
                <th>Ticket</th>
                <td id="field-ticket"></td>
              </tr>
              <tr>
                <th>Referencia</th>
                <td id="field-reference"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="actions">
          <a class="btn" href="/">Intentar otro pago</a>
        </div>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const approved = params.get("status") === "approved";
      document.getElementById("hero-title").textContent = approved
        ? "Pago aprobado"
        : "Pago declinado";
      document.getElementById("hero-subtitle").textContent = approved
        ? "El cargo se completó en el ambiente UAT"
        : "La transacción no se cobró";
      document.getElementById("status-title").textContent = approved
        ? "Transacción aprobada"
        : "Transacción declinada";
      document.getElementById("status-message").textContent =
        params.get("message") || (approved ? "(000) Transacción aprobada" : "Revisa el código de error");
      document.getElementById("field-status").textContent = approved ? "APPROVED" : "DECLINED";
      document.getElementById("field-status").className = approved ? "status-ok" : "status-no";
      document.getElementById("field-code").textContent = params.get("code") || (approved ? "000" : "—");
      document.getElementById("field-ticket").textContent = params.get("ticket") || "—";
      document.getElementById("field-reference").textContent = params.get("reference") || "—";
    </script>
  </body>
</html>
